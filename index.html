<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タスクボード</title>
<style>
  :root {
    --bg: #f0f2f5;
    --header-bg: #1f2937;
    --list-bg: #ebecf0;
    --card-bg: #ffffff;
    --accent: #2563eb;
    --danger: #dc2626;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #d1d5db;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--header-bg);
    color: #fff;
    padding: 14px 24px;
    flex-shrink: 0;
  }
  header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
  }

  main {
    flex: 1;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 20px;
  }

  #board {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    height: 100%;
  }

  .list {
    background: var(--list-bg);
    border-radius: 8px;
    width: 260px;
    min-width: 260px;
    max-height: 100%;
    display: flex;
    flex-direction: column;
    padding: 10px;
  }
  .list-placeholder {
    background: rgba(37,99,235,0.08);
    border: 2px dashed var(--accent);
    border-radius: 8px;
    width: 260px;
    min-width: 260px;
  }
  .list-ghost {
    position: fixed;
    margin: 0;
    pointer-events: none;
    z-index: 1000;
    opacity: 0.9;
    box-shadow: 0 10px 24px rgba(0,0,0,0.3);
    transform: rotate(2deg);
  }

  .list-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 4px 8px 4px;
    cursor: grab;
  }
  .list-header .handle {
    color: var(--muted);
    cursor: grab;
    user-select: none;
  }
  .list-title {
    flex: 1;
    font-weight: 600;
    font-size: 14px;
    background: transparent;
    border: none;
    outline: none;
    padding: 4px;
    border-radius: 4px;
    width: 0;
  }
  .list-title:focus {
    background: #fff;
    box-shadow: 0 0 0 2px var(--accent);
  }
  .count-badge {
    background: #d7dbe0;
    color: var(--muted);
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .list-delete {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .list-delete:hover {
    background: #dfe1e6;
    color: var(--danger);
  }

  .cards {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 10px;
    padding-bottom: 4px;
  }

  .card {
    background: var(--card-bg);
    border-radius: 6px;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    cursor: grab;
  }
  .card.dragging {
    opacity: 0.4;
  }
  .card-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    width: 100%;
  }
  .card input[type="checkbox"] {
    margin-top: 3px;
    flex-shrink: 0;
  }
  .priority-select {
    align-self: flex-start;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-family: inherit;
  }
  .priority-select.priority-high {
    background: #fee2e2;
    color: #b91c1c;
  }
  .priority-select.priority-mid {
    background: #fef9c3;
    color: #92400e;
  }
  .priority-select.priority-low {
    background: #dcfce7;
    color: #166534;
  }
  .card-text {
    flex: 1;
    font-size: 14px;
    line-height: 1.4;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .card-text.done {
    text-decoration: line-through;
    color: var(--muted);
  }
  .card-edit {
    flex: 1;
    font-size: 14px;
    line-height: 1.4;
    font-family: inherit;
    border: none;
    outline: none;
    resize: none;
    padding: 0;
    box-shadow: 0 0 0 2px var(--accent);
    border-radius: 3px;
  }
  .card-delete {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    flex-shrink: 0;
    padding: 0 2px;
  }
  .card-delete:hover {
    color: var(--danger);
  }

  .card-placeholder {
    height: 46px;
    background: rgba(37,99,235,0.12);
    border: 2px dashed var(--accent);
    border-radius: 6px;
  }

  .add-card-btn, .add-list-btn {
    background: none;
    border: none;
    text-align: left;
    color: var(--muted);
    font-size: 14px;
    padding: 6px 4px;
    cursor: pointer;
    border-radius: 4px;
  }
  .add-card-btn:hover {
    background: #dfe1e6;
    color: var(--text);
  }

  .add-card-form, .add-list-form {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .add-card-form textarea {
    font-family: inherit;
    font-size: 14px;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    resize: none;
  }
  .add-list-form input {
    font-family: inherit;
    font-size: 14px;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
  }
  .form-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
  }
  .btn-primary:hover {
    background: #1d4ed8;
  }
  .btn-cancel {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 20px;
    cursor: pointer;
    line-height: 1;
  }

  .add-list-wrapper {
    flex-shrink: 0;
    width: 260px;
  }
  .add-list-btn.outer {
    background: rgba(255,255,255,0.4);
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    font-weight: 500;
  }
  .add-list-btn.outer:hover {
    background: rgba(255,255,255,0.7);
  }
  .add-list-form.outer {
    background: var(--list-bg);
    padding: 10px;
    border-radius: 8px;
  }
</style>
</head>
<body>

<header>
  <h1>タスクボード</h1>
</header>

<main>
  <div id="board"></div>
</main>

<script>
const STORAGE_KEY = 'trello-lite-board';

const defaultData = [
  { id: 'a1b2c3', title: '未着手', cards: [
    { id: 'x1y2z3', text: '資料を作成する', done: false }
  ]},
  { id: 'd4e5f6', title: '進行中', cards: [] },
  { id: 'g7h8i9', title: '完了', cards: [
    { id: 'p1q2r3', text: '要件定義をまとめる', done: true }
  ]}
];

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return JSON.parse(JSON.stringify(defaultData));
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(lists));
}

function uid() {
  return Math.random().toString(36).slice(2, 9);
}

let lists = loadData();
let dragState = null; // { type: 'list'|'card', listId, cardId }

const board = document.getElementById('board');

function render() {
  board.innerHTML = '';

  lists.forEach(list => {
    const listEl = document.createElement('div');
    listEl.className = 'list';
    listEl.dataset.listId = list.id;

    // list drag & drop (reorder lists)
    listEl.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (dragState && dragState.type === 'list') {
        listEl.classList.add('drag-over');
      }
    });
    listEl.addEventListener('dragleave', () => listEl.classList.remove('drag-over'));
    listEl.addEventListener('drop', (e) => {
      e.preventDefault();
      listEl.classList.remove('drag-over');
      if (dragState && dragState.type === 'list' && dragState.listId !== list.id) {
        const fromIdx = lists.findIndex(l => l.id === dragState.listId);
        const toIdx = lists.findIndex(l => l.id === list.id);
        const [moved] = lists.splice(fromIdx, 1);
        lists.splice(toIdx, 0, moved);
        saveData();
        render();
      }
    });

    // header
    const header = document.createElement('div');
    header.className = 'list-header';
    header.draggable = true;
    header.addEventListener('dragstart', (e) => {
      dragState = { type: 'list', listId: list.id };
      e.dataTransfer.effectAllowed = 'move';
    });
    header.addEventListener('dragend', () => { dragState = null; });

    const handle = document.createElement('span');
    handle.className = 'handle';
    handle.textContent = '⠿';
    header.appendChild(handle);

    const titleInput = document.createElement('input');
    titleInput.className = 'list-title';
    titleInput.value = list.title;
    titleInput.addEventListener('change', () => {
      list.title = titleInput.value.trim() || list.title;
      saveData();
      render();
    });
    header.appendChild(titleInput);

    const countBadge = document.createElement('span');
    countBadge.className = 'count-badge';
    countBadge.textContent = list.cards.length;
    header.appendChild(countBadge);

    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'list-delete';
    deleteBtn.textContent = '×';
    deleteBtn.addEventListener('click', () => {
      if (confirm(`リスト「${list.title}」を削除しますか?`)) {
        lists = lists.filter(l => l.id !== list.id);
        saveData();
        render();
      }
    });
    header.appendChild(deleteBtn);

    listEl.appendChild(header);

    // cards container
    const cardsEl = document.createElement('div');
    cardsEl.className = 'cards';

    cardsEl.addEventListener('dragover', (e) => {
      if (dragState && dragState.type === 'card') {
        e.preventDefault();
      }
    });
    cardsEl.addEventListener('drop', (e) => {
      e.preventDefault();
      if (!dragState || dragState.type !== 'card') return;
      const fromList = lists.find(l => l.id === dragState.listId);
      const cardIdx = fromList.cards.findIndex(c => c.id === dragState.cardId);
      const [movedCard] = fromList.cards.splice(cardIdx, 1);
      list.cards.push(movedCard);
      saveData();
      render();
    });

    list.cards.forEach(card => {
      const cardEl = document.createElement('div');
      cardEl.className = 'card';
      cardEl.draggable = true;
      cardEl.dataset.cardId = card.id;

      cardEl.addEventListener('dragstart', (e) => {
        dragState = { type: 'card', listId: list.id, cardId: card.id };
        cardEl.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.stopPropagation();
      });
      cardEl.addEventListener('dragend', () => {
        dragState = null;
        cardEl.classList.remove('dragging');
      });
      cardEl.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.stopPropagation();
      });
      cardEl.addEventListener('drop', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (!dragState || dragState.type !== 'card') return;
        if (dragState.cardId === card.id) return;
        const fromList = lists.find(l => l.id === dragState.listId);
        const cardIdx = fromList.cards.findIndex(c => c.id === dragState.cardId);
        const [movedCard] = fromList.cards.splice(cardIdx, 1);
        const toIdx = list.cards.findIndex(c => c.id === card.id);
        list.cards.splice(toIdx, 0, movedCard);
        saveData();
        render();
      });

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = card.done;
      checkbox.addEventListener('change', () => {
        card.done = checkbox.checked;
        saveData();
        render();
      });
      cardEl.appendChild(checkbox);

      const textEl = document.createElement('div');
      textEl.className = 'card-text' + (card.done ? ' done' : '');
      textEl.textContent = card.text;
      textEl.addEventListener('click', () => {
        const textarea = document.createElement('textarea');
        textarea.className = 'card-edit';
        textarea.value = card.text;
        textarea.rows = 2;
        cardEl.replaceChild(textarea, textEl);
        textarea.focus();
        textarea.select();

        const commit = () => {
          const val = textarea.value.trim();
          if (val) card.text = val;
          saveData();
          render();
        };
        textarea.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            commit();
          } else if (e.key === 'Escape') {
            render();
          }
        });
        textarea.addEventListener('blur', commit);
      });
      cardEl.appendChild(textEl);

      const cardDelete = document.createElement('button');
      cardDelete.className = 'card-delete';
      cardDelete.textContent = '×';
      cardDelete.addEventListener('click', () => {
        list.cards = list.cards.filter(c => c.id !== card.id);
        saveData();
        render();
      });
      cardEl.appendChild(cardDelete);

      cardsEl.appendChild(cardEl);
    });

    listEl.appendChild(cardsEl);

    // add card
    const addCardWrapper = document.createElement('div');

    function showAddCardBtn() {
      addCardWrapper.innerHTML = '';
      const btn = document.createElement('button');
      btn.className = 'add-card-btn';
      btn.textContent = '+ カードを追加';
      btn.addEventListener('click', showAddCardForm);
      addCardWrapper.appendChild(btn);
    }

    function showAddCardForm() {
      addCardWrapper.innerHTML = '';
      const form = document.createElement('div');
      form.className = 'add-card-form';

      const textarea = document.createElement('textarea');
      textarea.rows = 2;
      textarea.placeholder = 'カードの内容を入力';
      form.appendChild(textarea);

      const actions = document.createElement('div');
      actions.className = 'form-actions';
      const addBtn = document.createElement('button');
      addBtn.className = 'btn-primary';
      addBtn.textContent = '追加';
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'btn-cancel';
      cancelBtn.textContent = '×';

      function commit() {
        const val = textarea.value.trim();
        if (val) {
          list.cards.push({ id: uid(), text: val, done: false });
          saveData();
          render();
        } else {
          showAddCardBtn();
        }
      }

      addBtn.addEventListener('click', commit);
      cancelBtn.addEventListener('click', showAddCardBtn);
      textarea.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          commit();
        } else if (e.key === 'Escape') {
          showAddCardBtn();
        }
      });

      actions.appendChild(addBtn);
      actions.appendChild(cancelBtn);
      form.appendChild(actions);
      addCardWrapper.appendChild(form);
      textarea.focus();
    }

    showAddCardBtn();
    listEl.appendChild(addCardWrapper);

    board.appendChild(listEl);
  });

  // add list
  const addListWrapper = document.createElement('div');
  addListWrapper.className = 'add-list-wrapper';

  function showAddListBtn() {
    addListWrapper.innerHTML = '';
    const btn = document.createElement('button');
    btn.className = 'add-list-btn outer';
    btn.textContent = '+ リストを追加';
    btn.addEventListener('click', showAddListForm);
    addListWrapper.appendChild(btn);
  }

  function showAddListForm() {
    addListWrapper.innerHTML = '';
    const form = document.createElement('div');
    form.className = 'add-list-form outer';

    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'リスト名を入力';
    form.appendChild(input);

    const actions = document.createElement('div');
    actions.className = 'form-actions';
    const addBtn = document.createElement('button');
    addBtn.className = 'btn-primary';
    addBtn.textContent = '追加';
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn-cancel';
    cancelBtn.textContent = '×';

    function commit() {
      const val = input.value.trim();
      if (val) {
        lists.push({ id: uid(), title: val, cards: [] });
        saveData();
        render();
      } else {
        showAddListBtn();
      }
    }

    addBtn.addEventListener('click', commit);
    cancelBtn.addEventListener('click', showAddListBtn);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        commit();
      } else if (e.key === 'Escape') {
        showAddListBtn();
      }
    });

    actions.appendChild(addBtn);
    actions.appendChild(cancelBtn);
    form.appendChild(actions);
    addListWrapper.appendChild(form);
    input.focus();
  }

  showAddListBtn();
  board.appendChild(addListWrapper);
}

render();
</script>

</body>
</html>
